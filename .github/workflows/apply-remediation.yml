name: Diagnosticar remediacao SGJ v0.3

on:
  push:
    branches: [fix/auditoria-v0.3]
    paths:
      - '.github/workflows/apply-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: fix/auditoria-v0.3
          fetch-depth: 0

      - name: Recompor pacote de remediacao
        shell: bash
        run: |
          cat .github/remediation/*.txt | base64 -d > /tmp/sgj-v03-remediation.tar.gz
          tar -xzf /tmp/sgj-v03-remediation.tar.gz -C .
          python3 - <<'PY'
          import binascii
          import struct
          import zlib
          from pathlib import Path

          width = height = 512
          rgba = bytes((27, 78, 115, 255))
          raw = b''.join(b'\x00' + rgba * width for _ in range(height))

          def chunk(kind: bytes, data: bytes) -> bytes:
              body = kind + data
              return struct.pack('>I', len(data)) + body + struct.pack('>I', binascii.crc32(body) & 0xffffffff)

          png = (
              b'\x89PNG\r\n\x1a\n'
              + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
              + chunk(b'IDAT', zlib.compress(raw, 9))
              + chunk(b'IEND', b'')
          )
          target = Path('apps/desktop/src-tauri/icons/icon.png')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(png)
          PY

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Dependencias Linux oficiais do Tauri
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Gerar Cargo.lock
        working-directory: apps/desktop/src-tauri
        run: cargo generate-lockfile

      - name: Capturar cargo check
        shell: bash
        run: |
          set +e
          cd apps/desktop/src-tauri
          cargo check --locked > /tmp/cargo-check.log 2>&1
          CODE=$?
          cd ../../..
          cp /tmp/cargo-check.log docs/_cargo_check.log
          printf '\nEXIT_CODE=%s\n' "$CODE" >> docs/_cargo_check.log
          exit 0

      - name: Publicar log de diagnostico
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/_cargo_check.log
          git commit -m 'chore: registrar diagnostico cargo check'
          git push origin HEAD:fix/auditoria-v0.3
