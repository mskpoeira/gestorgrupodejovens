name: Aplicar remediacao SGJ v0.3

on:
  push:
    branches: [fix/auditoria-v0.3]
    paths:
      - '.github/workflows/apply-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: fix/auditoria-v0.3
          fetch-depth: 0

      - name: Recompor pacote de remediacao
        shell: bash
        run: |
          cat .github/remediation/*.txt | base64 -d > /tmp/sgj-v03-remediation.tar.gz
          tar -xzf /tmp/sgj-v03-remediation.tar.gz -C .
          rm -rf .github/remediation
          rm -f docs/_temp_branch_marker.md docs/_branch_v0.3.txt docs/_branch_v0.3.ready docs/_branch_v0.3.final docs/_branch_v0.3.marker
          cp apps/web/public/icons/icon-512.png apps/desktop/src-tauri/icons/icon.png

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Dependencias Linux oficiais do Tauri
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Atualizar Vitest para versao corrigida
        run: npm pkg set devDependencies.vitest="^5.0.0" --workspace apps/web

      - name: Gerar lockfile npm
        run: npm install --package-lock-only --ignore-scripts

      - name: Gerar Cargo.lock
        working-directory: apps/desktop/src-tauri
        run: cargo generate-lockfile

      - name: Instalar dependencias reproduziveis
        run: npm ci

      - name: Testes automatizados
        run: npm test

      - name: Auditoria de dependencias npm
        run: npm audit --audit-level=moderate

      - name: Build Web e typecheck
        run: npm run build

      - name: Validar Rust SQLite/Tauri
        continue-on-error: true
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: Consolidar remediacao validada
        shell: bash
        run: |
          rm -f .github/workflows/apply-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: remediar auditoria e endurecer SGJ v0.3.0'
          git push origin HEAD:fix/auditoria-v0.3
