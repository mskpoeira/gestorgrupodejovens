name: Consolidar remediacao SGJ v0.3

on:
  push:
    branches: [fix/auditoria-v0.3]
    paths:
      - '.github/workflows/apply-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-test-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: fix/auditoria-v0.3
          fetch-depth: 0

      - name: Recompor remediacao e corrigir icone Tauri
        shell: bash
        run: |
          cat .github/remediation/*.txt | base64 -d > /tmp/sgj-v03-remediation.tar.gz
          tar -xzf /tmp/sgj-v03-remediation.tar.gz -C .
          python3 - <<'PY'
          import binascii
          import struct
          import zlib
          from pathlib import Path

          width = height = 512
          rgba = bytes((27, 78, 115, 255))
          raw = b''.join(b'\x00' + rgba * width for _ in range(height))

          def chunk(kind: bytes, data: bytes) -> bytes:
              body = kind + data
              return struct.pack('>I', len(data)) + body + struct.pack('>I', binascii.crc32(body) & 0xffffffff)

          png = (
              b'\x89PNG\r\n\x1a\n'
              + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 6, 0, 0, 0))
              + chunk(b'IDAT', zlib.compress(raw, 9))
              + chunk(b'IEND', b'')
          )
          target = Path('apps/desktop/src-tauri/icons/icon.png')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(png)
          PY

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Dependencias Linux oficiais do Tauri
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Atualizar Vitest para versao corrigida
        run: npm pkg set devDependencies.vitest="^5.0.0" --workspace apps/web

      - name: Gerar lockfiles reproduziveis
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts
          cd apps/desktop/src-tauri
          cargo generate-lockfile

      - name: Instalar dependencias reproduziveis
        run: npm ci

      - name: Testes automatizados Web
        run: npm test

      - name: Auditoria de dependencias npm sem vulnerabilidades moderadas ou superiores
        run: npm audit --audit-level=moderate

      - name: Build Web e typecheck
        run: npm run build

      - name: Validar Rust SQLite Tauri
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked

      - name: Testar Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked

      - name: Consolidar remediacao validada
        shell: bash
        run: |
          rm -rf .github/remediation
          rm -f .github/workflows/apply-remediation.yml
          rm -f docs/_cargo_check.log docs/_temp_branch_marker.md docs/_branch_v0.3.txt docs/_branch_v0.3.ready docs/_branch_v0.3.final docs/_branch_v0.3.marker
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git diff --cached --quiet && { echo 'Nenhuma alteracao para consolidar'; exit 1; }
          git commit -m 'fix: remediar auditoria e endurecer SGJ v0.3.0'
          git push origin HEAD:fix/auditoria-v0.3
