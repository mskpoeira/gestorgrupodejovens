name: Deploy Web SGJ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Testes automatizados
        run: npm test

      - name: Build Web
        run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Publicar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

      - name: Implantar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
