name: Deploy Web SGJ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproduziveis
        run: npm ci

      - name: Testes automatizados
        run: npm test

      - name: Auditoria de dependencias
        run: npm audit --audit-level=high

      - name: Build Web para GitHub Pages
        run: npm --workspace apps/web run build -- --base=/gestorgrupodejovens/

      - name: Configurar e habilitar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Publicar artefato do Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

      - name: Implantar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
