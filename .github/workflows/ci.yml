name: CI SGJ

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Testes automatizados
        run: npm test
      - name: Validar build Web
        run: npm run build

  desktop-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependências
        run: npm install
      - name: Gerar aplicação Windows
        run: npm run desktop:build
