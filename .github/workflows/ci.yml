name: CI SGJ

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Validar build Web
        run: npm run build

  desktop-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependências
        run: npm install
      - name: Verificar Rust/Tauri
        working-directory: apps/desktop/src-tauri
        run: cargo check
