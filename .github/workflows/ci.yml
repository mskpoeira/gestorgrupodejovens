name: CI SGJ

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências reproduzíveis
        run: npm ci
      - name: Testes automatizados
        run: npm test
      - name: Auditoria de dependências
        run: npm audit --audit-level=moderate
      - name: Build Web e typecheck
        run: npm run build

  desktop-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependências reproduzíveis
        run: npm ci
      - name: Gerar aplicação Windows
        run: npm run desktop:build
