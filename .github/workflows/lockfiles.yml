name: Atualizar lockfiles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'apps/*/package.json'
      - 'apps/desktop/src-tauri/Cargo.toml'
      - '.github/workflows/lockfiles.yml'

permissions:
  contents: write

jobs:
  lockfiles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Gerar package-lock
        run: npm install --package-lock-only
      - name: Gerar Cargo.lock
        working-directory: apps/desktop/src-tauri
        run: cargo generate-lockfile
      - name: Commitar lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json apps/desktop/src-tauri/Cargo.lock
          git diff --cached --quiet && exit 0
          git commit -m "chore: atualizar lockfiles reproduzíveis"
          git push
